<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agenda - Atualizar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="topo">
            <h1>Agenda Pessoal de Contatos</h1>
            <nav>
                <a href="index.html">Ver Contatos</a>
                <a href="cadastrar.html">Novo Contato</a>
                <a href="atualizar.html">Modificar Cadastro</a>
                <a href="excluir.html">Remover Registro</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="card">
            <h2>Localizar Contato para Atualização</h2>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="busca-id" placeholder="Digite o ID do contato...">
                <button class="btn-primary" id="btn-carregar">Carregar Dados</button>
            </div>
        </div>

        <div class="card" id="bloco-edicao" style="display: none;">
            <h2>Atualizar Informações</h2>
            <form id="form-atualizar">
                <div class="grid">
                    <div class="campo"><label>Nome:</label><input type="text" id="nome" required></div>
                    <div class="campo"><label>E-mail:</label><input type="email" id="email" required></div>
                    <div class="campo"><label>Telefone:</label><input type="text" id="telefone" required></div>
                    <div class="campo"><label>Data de Nascimento:</label><input type="date" id="data_nascimento" required></div>
                    <div class="campo"><label>CEP:</label><input type="text" id="cep" required></div>
                    <div class="campo"><label>Rua:</label><input type="text" id="logradouro" required></div>
                    <div class="campo"><label>Número:</label><input type="text" id="numero" required></div>
                    <div class="campo"><label>Bairro:</label><input type="text" id="bairro" required></div>
                    <div class="campo"><label>Cidade:</label><input type="text" id="cidade" required></div>
                    <div class="campo"><label>Estado:</label><input type="text" id="estado" required></div>
                </div>
                <div class="acoes"><button type="submit" class="btn-success">Confirmar Modificações</button></div>
            </form>
        </div>
        <div id="msg" class="mensagem" style="display:none;"></div>
    </main>
    <script type="module">
        import { mascararTelefone, mascararCEP, exibirMensagem } from './js/utils.js';
        
        document.getElementById('telefone').addEventListener('input', (e) => mascararTelefone(e.target));
        document.getElementById('cep').addEventListener('input', (e) => mascararCEP(e.target));

        let idAtual = null;

        document.getElementById('btn-carregar').addEventListener('click', async () => {
            const id = document.getElementById('busca-id').value;
            if(!id) return;
            const res = await fetch(`/api/contatos?id=${id}`);
            if(res.ok) {
                const c = await res.json();
                idAtual = c.id;
                document.getElementById('nome').value = c.nome;
                document.getElementById('email').value = c.email;
                document.getElementById('telefone').value = c.telefone;
                document.getElementById('data_nascimento').value = c.data_nascimento;
                document.getElementById('cep').value = c.cep;
                document.getElementById('logradouro').value = c.logradouro;
                document.getElementById('numero').value = c.numero;
                document.getElementById('bairro').value = c.bairro;
                document.getElementById('cidade').value = c.cidade;
                document.getElementById('estado').value = c.estado;
                document.getElementById('bloco-edicao').style.display = 'block';
            } else {
                exibirMensagem('msg', 'Contato não localizado!', '#dc2626');
                document.getElementById('bloco-edicao').style.display = 'none';
            }
        });

        document.getElementById('form-atualizar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                data_nascimento: document.getElementById('data_nascimento').value,
                cep: document.getElementById('cep').value,
                logradouro: document.getElementById('logradouro').value,
                numero: document.getElementById('numero').value,
                bairro: document.getElementById('bairro').value,
                cidade: document.getElementById('cidade').value,
                estado: document.getElementById('estado').value
            };

            const res = await fetch(`/api/contatos?id=${idAtual}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            if(res.ok) {
                exibirMensagem('msg', 'Registro atualizado com sucesso!', '#16a34a');
                document.getElementById('bloco-edicao').style.display = 'none';
                document.getElementById('form-atualizar').reset();
            } else {
                const err = await res.json();
                exibirMensagem('msg', err.error, '#dc2626');
            }
        });
    </script>
</body>
</html>
