<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agenda - Cadastrar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="topo">
            <h1>Agenda Pessoal de Contatos</h1>
            <nav>
                <a href="index.html">Ver Contatos</a>
                <a href="cadastrar.html">Novo Contato</a>
                <a href="atualizar.html">Modificar Cadastro</a>
                <a href="excluir.html">Remover Registro</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="card">
            <h2>Adicionar Novo Contato</h2>
            <form id="form-cadastro">
                <div class="grid">
                    <div class="campo"><label>Nome Completo:</label><input type="text" id="nome" required></div>
                    <div class="campo"><label>E-mail:</label><input type="email" id="email" required></div>
                    <div class="campo"><label>Telefone:</label><input type="text" id="telefone" placeholder="(00) 00000-0000" required></div>
                    <div class="campo"><label>Data de Nascimento:</label><input type="date" id="data_nascimento" required></div>
                    <div class="campo"><label>CEP:</label><input type="text" id="cep" placeholder="00000-000" required></div>
                    <div class="campo"><label>Rua/Logradouro:</label><input type="text" id="logradouro" required></div>
                    <div class="campo"><label>Número:</label><input type="text" id="numero" required></div>
                    <div class="campo"><label>Bairro:</label><input type="text" id="bairro" required></div>
                    <div class="campo"><label>Cidade:</label><input type="text" id="cidade" required></div>
                    <div class="campo"><label>Estado (UF):</label><input type="text" id="estado" maxlength="2" required></div>
                </div>
                <div class="acoes"><button type="submit" class="btn-primary">Adicionar Contato</button></div>
            </form>
            <div id="msg" class="mensagem" style="display:none;"></div>
        </div>
    </main>
    <script type="module">
        import { mascararTelefone, mascararCEP, exibirMensagem } from './js/utils.js';
        
        document.getElementById('telefone').addEventListener('input', (e) => mascararTelefone(e.target));
        document.getElementById('cep').addEventListener('input', (e) => mascararCEP(e.target));
        
        document.getElementById('cep').addEventListener('blur', async function() {
            const cep = this.value.replace(/\D/g, '');
            if(cep.length === 8) {
                const res = await fetch(`https://viacep.com.br{cep}/json/`);
                const data = await res.json();
                if(!data.erro) {
                    document.getElementById('logradouro').value = data.logradouro;
                    document.getElementById('bairro').value = data.bairro;
                    document.getElementById('cidade').value = data.localidade;
                    document.getElementById('estado').value = data.uf;
                    document.getElementById('numero').focus();
                }
            }
        });

        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                data_nascimento: document.getElementById('data_nascimento').value,
                cep: document.getElementById('cep').value,
                logradouro: document.getElementById('logradouro').value,
                numero: document.getElementById('numero').value,
                bairro: document.getElementById('bairro').value,
                cidade: document.getElementById('cidade').value,
                estado: document.getElementById('estado').value
            };

            const res = await fetch('/api/contatos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const data = await res.json();
            if(res.ok) {
                exibirMensagem('msg', data.message, '#16a34a');
                document.getElementById('form-cadastro').reset();
            } else {
                exibirMensagem('msg', data.error, '#dc2626');
            }
        });
    </script>
</body>
</html>
